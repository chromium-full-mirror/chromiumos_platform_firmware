description     "Install firmware DLC"
author          "chromium-os-dev@chromium.org"

# We use the firmware inside firmware DLC at recovery and auto update. Both
# process can't install DLC at that timing. Install the firmware DLC using
# this job to secure a space as early as possible.

# Disable OOM killer as we must never fail.
oom score never

start on started dlcservice
task

exec dlcservice_util --id=chromeos-firmware --install
